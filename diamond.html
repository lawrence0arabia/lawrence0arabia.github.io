<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="diamond/diamond.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="diamond/assets/icon-large.png">
    <title>Diamond for Obsidian</title>
</head>
<body>
    <div id="interactive-bg"></div>

    <div class="main-container">
        <a href="https://ryanigans.com" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
        </a>
        <main class="content glass-card">
            <section class="hero">
                <img src="diamond/assets/icon-large.png" alt="Diamond Icon" class="floating-icon">
                <h1>diamond</h1>
                <h2>for obsidian</h2>
                <p>Your vault on your wrist.</p>

                <a href="https://play.google.com/apps/testing/com.ryanigans.diamond/join?hl=en-US" class="play-store-btn" target="_blank">
                    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                        <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
                    </svg>
                    <span>Get it on Google Play</span>
                </a>
            </section>

            <section class="screenshots">
                <div class="card" tabindex="0" role="button"><img src="diamond/assets/phone-vertical-hero-shot.png" alt="Vertical hero shot phone"></div>
                <div class="card" tabindex="0" role="button"><img src="diamond/assets/vertical-hero-shot-watch.png" alt="Vertical hero shot watch"></div>
                <div class="card" tabindex="0" role="button"><img src="diamond/assets/phone-dark.png" alt="Screenshot 1"></div>
                <div class="card" tabindex="0" role="button"><img src="diamond/assets/phone-light.png" alt="Screenshot 2"></div>
            </section>
        </main>

        <footer class="footer-links">
            <a href="diamond-privacy.html">privacy policy</a>
        </footer>
    </div>

    <script src="diamond/diamond.js"></script>
</body>
</html>
