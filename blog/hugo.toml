baseURL = "https://ryanigans.com/blog/"
languageCode = 'en-us'
title = 'ryanigans'
theme = "hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  displayUpdatedDate = true
  [params.navbar]
    displayTitle = true
    [params.navbar.logo]
      path = "android-chrome-192x192.png"
  [params.sidebar]
    defaultOpen = true
    displayEmpty = false # Set to true if you want to see folders even if empty
  [params.breadcrumb]
    enable = false