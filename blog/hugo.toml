baseURL = "https://ryanigans.com/blog/"
languageCode = 'en-us'
title = 'ryanigans'
theme = "hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  displayUpdatedDate = true
  [params.rss]
    # Hugo's default .Type for a page with no section (all our posts live
    # directly under content/) is "page", not "" — the theme's RSS template
    # filters on Type, so without this the feed silently has zero items.
    sections = ["page"]
  [params.navbar]
    displayTitle = true
    [params.navbar.logo]
      path = "android-chrome-192x192.png"
  [params.sidebar]
    defaultOpen = true
    displayEmpty = false # Set to true if you want to see folders even if empty
  [params.breadcrumb]
    enable = false