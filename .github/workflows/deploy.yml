name: Build Blog and Deploy Site

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Blog
        # We run Hugo inside the blog folder
        # We tell it to output the results to a temp folder
        run: |
          cd blog
          hugo --destination ../public/blog --minify

      - name: Copy Hand-coded Files
        # Move your root HTML/CSS into the same public folder
        run: |
          cp index.html public/
          cp -r css/ public/ || true
          cp .nojekyll public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4