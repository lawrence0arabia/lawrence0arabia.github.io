name: Build Blog and Deploy Site

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. The Build Job: Compiles Hugo and prepares the static files
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Blog
        # Builds the blog into a subfolder of 'public'
        run: |
          cd blog
          hugo --destination ../public/blog --minify

      - name: Copy Hand-coded Files
        run: |
          # 1. Copy the main HTML file
          cp index.html public/
          cp diamond.html public/
          cp readme.md public/
          cp diamond-privacy.html public/

          cp -r assets public/
          cp -r images public/
          cp -r diamond public/

          # 3. Copy essential GitHub/Domain files
          cp CNAME public/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 2. The Deploy Job: Pushes the compiled folder to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4